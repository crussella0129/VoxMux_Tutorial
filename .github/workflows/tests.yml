name: Tests

# None of this needs a graphics card or a model. The tests drive the real
# tkinter window with a scripted stand-in for the model. They run on all
# three systems because some of the code differs between them: how a
# stubborn MCP server is stopped, for one.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the formatter and the one package the tests need
        run: python -m pip install ruff==0.15.7 tzdata
      - name: Formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
      - name: Tests (a Linux runner has no screen, so xvfb pretends to be one)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
